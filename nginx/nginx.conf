worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Share the 200 requests/second per-IP limit across all workers.
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=200r/s;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log info;

    upstream api_backend {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        # Reject excess requests immediately, without a burst allowance.
        limit_req zone=per_ip;
        limit_req_status 429;

        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
